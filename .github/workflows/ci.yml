name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint · tests · data validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Tests (data contracts, transformations, performance thresholds)
        run: python -m pytest

  notebooks:
    name: Notebook reproducibility
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Execute all notebooks end to end
        working-directory: notebooks
        run: |
          for nb in 0*.ipynb; do
            jupyter nbconvert --to notebook --execute --output "/tmp/$nb" --ExecutePreprocessor.timeout=1800 "$nb"
          done
